name = "sharedpair-dev"
compatibility_date = "2026-08-31"
main = "worker/index.ts"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "404-page"
run_worker_first = true

[[durable_objects.bindings]]
name = "VOTE_COUNTER"
class_name = "VoteCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoteCounter"]

[[r2_buckets]]
binding = "APT_REPO"
bucket_name = "sharedpair-apt"

[[routes]]
pattern = "sharedpair.dev"
custom_domain = true

[[routes]]
pattern = "www.sharedpair.dev"
custom_domain = true

[[routes]]
pattern = "apt.sharedpair.dev"
custom_domain = true
