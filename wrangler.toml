name = "sharedpair-dev"
compatibility_date = "2026-08-31"
main = "worker/index.ts"

[assets]
binding = "ASSETS"
directory = "./dist"
not_found_handling = "404-page"
run_worker_first = true

[[durable_objects.bindings]]
name = "VOTE_COUNTER"
class_name = "VoteCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["VoteCounter"]

# No [[routes]]: sharedpair.dev and www are cloudflare_workers_custom_domain
# resources in infrastructure/cloudflare/global/workers.tf, so wrangler and
# Terraform never fight over the hostnames.
