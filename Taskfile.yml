version: "3"

vars:
  PROJECT: sharedpair
  PROFILE: sharedpair-terraform
  REGION: us-west-2
  TF_SAFE: ../python-tui-lib/scripts/tf-safe-apply.sh
  CF_DIR: infrastructure/cloudflare

tasks:
  aws-bootstrap:
    desc: "One-time: store the sharedpair-terraform AWS key, then create the S3 state backend. Mint the Cloudflare token afterwards with task cf-token-rotate."
    cmds:
      - |
        set -euo pipefail

        # Portable masked read. go-task runs cmds with mvdan/sh, whose `read`
        # lacks -n, so star-masking with `read -s -n1` breaks mid-entry.
        read_masked() {
          printf "%s" "$1" >/dev/tty
          stty -echo </dev/tty
          IFS= read -r REPLY </dev/tty
          stty echo </dev/tty
          printf "\n" >/dev/tty
          printf "%s" "$REPLY"
        }

        PROFILE="{{.PROFILE}}"
        CREDS=~/.aws/credentials
        CONFIG=~/.aws/config

        if aws sts get-caller-identity --profile "$PROFILE" &>/dev/null; then
          echo "✓ AWS profile ${PROFILE} already configured — skipping key entry."
        else
          echo ""
          echo "━━━ AWS: create the IAM user (manual, ~3 min) ━━━"
          echo "1. https://us-east-1.console.aws.amazon.com/iam/home#/users/create"
          echo "   Name: ${PROFILE}  |  No console access"
          echo "2. Set permissions → Attach policies directly → tick AdministratorAccess and"
          echo "   ReadOnlyAccess (clear the type filter if search hides one) → Next → Create user."
          echo "   Do NOT click 'Create policy' — that builds a custom policy you don't need."
          echo "3. Users list → click ${PROFILE} → Security credentials tab → Create access key"
          echo "   → Command Line Interface (CLI) → tick confirm → Next"
          echo "   → Description: ${PROFILE}-$(hostname) → Create access key."
          echo ""
          printf "Paste Access Key ID:     " >/dev/tty
          read -r KEY_ID </dev/tty
          KEY_SECRET=$(read_masked "Paste Secret Access Key: ")

          # Rewrite-or-create the section so a failed earlier entry is repaired.
          python3 -c "import configparser,sys; p,s,k,sec=sys.argv[1:5]; cp=configparser.ConfigParser(); cp.read(p); cp.has_section(s) or cp.add_section(s); cp.set(s,'aws_access_key_id',k); cp.set(s,'aws_secret_access_key',sec); f=open(p,'w'); cp.write(f); f.close()" "$CREDS" "$PROFILE" "$KEY_ID" "$KEY_SECRET"
          grep -q "^\[profile ${PROFILE}\]" "$CONFIG" 2>/dev/null \
            || printf "\n[profile %s]\nregion = {{.REGION}}\noutput = json\n" "$PROFILE" >> "$CONFIG"
          echo "✓ Profile written."
        fi

        echo "Verifying profile…"
        ACCOUNT=$(aws sts get-caller-identity --profile "$PROFILE" --query Account --output text)
        echo "✓ AWS account ${ACCOUNT}"

        if aws s3api head-bucket --bucket "{{.PROJECT}}-terraform-state" --profile "$PROFILE" &>/dev/null; then
          echo "✓ State backend already exists — skipping bootstrap Terraform."
        else
          echo ""
          echo "━━━ Bootstrap Terraform state backend ━━━"
          {{.TF_SAFE}} {{.CF_DIR}}/bootstrap init
          {{.TF_SAFE}} {{.CF_DIR}}/bootstrap apply -auto-approve
          echo "✓ State bucket and lock table created."
        fi

        echo ""
        echo "━━━ Bootstrap complete. Next: task cf-token-rotate ━━━"
        echo "Activate cost allocation tags once a tagged resource exists:"
        echo "  https://us-east-1.console.aws.amazon.com/billing/home#/tags → Project, ManagedBy, Environment"

  tf-validate:
    desc: "Offline syntax/schema check of every Terraform dir (no backend, no credentials)."
    cmds:
      - |
        set -euo pipefail
        for d in {{.CF_DIR}}/bootstrap {{.CF_DIR}}/iam-self {{.CF_DIR}}/global infrastructure/aws/iam-self; do
          echo "── $d"
          terraform -chdir="$d" init -backend=false -input=false >/dev/null
          terraform -chdir="$d" validate
        done

  cf-token-rotate:
    desc: "Mint, widen or rotate sharedpair-cf-token: prompt (hidden) for a one-shot bootstrap token, apply iam-self with it, store the narrow token in SSM, then revoke the bootstrap token. The bootstrap token is never written anywhere."
    cmds:
      - |
        set -euo pipefail
        read_masked() {
          printf "%s" "$1" >/dev/tty
          stty -echo </dev/tty
          IFS= read -r REPLY </dev/tty
          stty echo </dev/tty
          printf "\n" >/dev/tty
          printf "%s" "$REPLY"
        }
        CF=https://api.cloudflare.com/client/v4
        echo "━━━ Cloudflare: mint a one-shot bootstrap token (~2 min) ━━━"
        echo "https://dash.cloudflare.com/profile/api-tokens → Create Token → Custom token"
        echo "  Name: sharedpair-bootstrap"
        echo "  Permissions:  Account → API Tokens → Edit"
        echo "                User    → API Tokens → Edit   (only used to revoke this token at the end)"
        echo "  Account Resources: Include → Wbnorris@gmail.com's Account"
        echo "  TTL: end date tomorrow (this task revokes it anyway)"
        echo ""
        B=$(read_masked "Paste the bootstrap token: ")
        STATUS=$(curl -sS -H "Authorization: Bearer $B" "$CF/user/tokens/verify" | python3 -c 'import json,sys; r=json.load(sys.stdin); print((r.get("result") or {}).get("status","invalid"))')
        [ "$STATUS" = active ] || { echo "✗ token is not active ($STATUS) — nothing changed." >&2; exit 1; }
        # Active isn't enough: a token missing the permission still verifies
        # (hit 2026-10-30). Check exactly what iam-self needs: the account's
        # token API. An earlier gate also required GET /user/tokens, which
        # refused three correctly-built tokens (9109) on 2026-10-30/31 and
        # stopped them before this check or Terraform ever ran.
        # Print Cloudflare's own errors on failure: the bare "can't read" message
        # hid the cause through four failed runs (2026-10-30/31).
        RESP=$(curl -sS -H "Authorization: Bearer $B" "$CF/accounts/f7e1e6cd8b3414a6d2226152533c21f2/tokens?per_page=1")
        if ! printf "%s" "$RESP" | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)'; then
          echo "✗ token can't read account f7e1e6cd8b3414a6d2226152533c21f2's API tokens (Account → Account API Tokens: Edit) — nothing changed." >&2
          printf "%s" "$RESP" | python3 -c 'import json,sys; [print("  Cloudflare", e.get("code"), "-", e.get("message"), file=sys.stderr) for e in json.load(sys.stdin).get("errors") or []]' || true
          curl -sS -H "Authorization: Bearer $B" "$CF/accounts?per_page=50" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); print("  accounts this token can see:", ", ".join(a["name"] + " (" + a["id"] + ")" for a in r.get("result") or []) or "none", file=sys.stderr)' || true
          echo "  Revoke it at https://dash.cloudflare.com/profile/api-tokens before minting another." >&2
          exit 1
        fi
        echo "✓ bootstrap token verified"
        # One-shot from here on, and held only in this process: it used to be
        # parked in SSM between steps, where a dead value outlived a failed run
        # and was picked up again (2026-10-30). Revoke it however the run ends.
        ID=$(curl -sS -H "Authorization: Bearer $B" "$CF/user/tokens/verify" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["id"])')
        revoke() {
          if curl -sS -X DELETE -H "Authorization: Bearer $B" "$CF/user/tokens/$ID" \
              | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)'; then
            echo "✓ bootstrap token revoked"
          else
            echo "✗ couldn't revoke the bootstrap token — delete sharedpair-bootstrap at https://dash.cloudflare.com/profile/api-tokens" >&2
          fi
        }
        trap revoke EXIT
        export CLOUDFLARE_API_TOKEN="$B"
        {{.TF_SAFE}} {{.CF_DIR}}/iam-self init
        {{.TF_SAFE}} {{.CF_DIR}}/iam-self apply
        terraform -chdir={{.CF_DIR}}/iam-self output -raw token_value \
          | aws ssm put-parameter --profile {{.PROFILE}} --region {{.REGION}} \
              --name /{{.PROJECT}}/cloudflare/api_token --type SecureString --overwrite --value file:///dev/stdin >/dev/null
        echo "✓ sharedpair-cf-token stored in SSM /{{.PROJECT}}/cloudflare/api_token"

  tf-apply-aws-iam:
    desc: "Apply infrastructure/aws/iam-self: attach the sharedpair-terraform-scoped policy (Admin/ReadOnly are detached separately, after simulation)."
    cmds:
      - |
        set -euo pipefail
        {{.TF_SAFE}} infrastructure/aws/iam-self init
        {{.TF_SAFE}} infrastructure/aws/iam-self apply

  tf-plan:
    desc: "Plan infrastructure/cloudflare/global with the narrow token read from SSM (never written to disk)."
    cmds:
      - |
        set -euo pipefail
        CLOUDFLARE_API_TOKEN=$(aws ssm get-parameter --profile {{.PROFILE}} --region {{.REGION}} \
          --name /{{.PROJECT}}/cloudflare/api_token --with-decryption --query Parameter.Value --output text)
        export CLOUDFLARE_API_TOKEN
        {{.TF_SAFE}} {{.CF_DIR}}/global plan

  tf-apply:
    desc: "Apply infrastructure/cloudflare/global with the narrow token read from SSM."
    cmds:
      - |
        set -euo pipefail
        CLOUDFLARE_API_TOKEN=$(aws ssm get-parameter --profile {{.PROFILE}} --region {{.REGION}} \
          --name /{{.PROJECT}}/cloudflare/api_token --with-decryption --query Parameter.Value --output text)
        export CLOUDFLARE_API_TOKEN
        {{.TF_SAFE}} {{.CF_DIR}}/global apply
